name: ci

# vet and test on the systems hb runs on. macOS is billed at ten times the
# minutes of Linux, so it runs on pushes to main only, not on pull requests.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", LICENSE]
  pull_request:
    paths-ignore: ["**.md", "docs/**", LICENSE]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  # every release target builds, without cgo (the release does the same)
  build:
    name: build (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null ./cmd/hb
          done
